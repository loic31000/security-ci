name: Report generator tests
on:
  push:
    branches: [main, feat/readable-quality-reports]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reports:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Install report parser dependency
        run: python -m pip install 'defusedxml==0.7.1'
      - name: Test Markdown report generators
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Prove certification on real executed JUnit tests
        run: |
          python -m pip install 'pytest==8.4.2'
          mkdir -p .audit-tests
          start_ns="$(python -c 'import time; print(time.time_ns())')"
          python -m pytest tests -q --junitxml=.audit-tests/junit.xml
          python scripts/test_report_validator.py --path .audit-tests/junit.xml \
            --workspace "$GITHUB_WORKSPACE" --start-ns "$start_ns"

      # TEMPORARY bootstrap; removed before merge. Runs only on this trusted PR branch.
      - name: Setup Go for reviewed checksums expansion
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/preinstall-python-go-locks' && github.event.pull_request.head.repo.full_name == 'loic31000/security-ci'
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: '1.25.x'
          cache: false
      - name: Expand Go checksums without changing locked module versions
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/preinstall-python-go-locks' && github.event.pull_request.head.repo.full_name == 'loic31000/security-ci'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/reviewed-go"
          cp locks/gitleaks/go.mod locks/gitleaks/go.sum "$RUNNER_TEMP/reviewed-go/"
          (
            cd "$RUNNER_TEMP/reviewed-go"
            GOTOOLCHAIN=local GOSUMDB=sum.golang.org GOPROXY=https://proxy.golang.org go mod download all
            GOTOOLCHAIN=local go mod verify
          )
          cmp -s locks/gitleaks/go.mod "$RUNNER_TEMP/reviewed-go/go.mod"
          python3 - <<'PY'
          import base64
          import hashlib
          import os
          from pathlib import Path
          before = Path("locks/gitleaks/go.sum").read_text().splitlines()
          after = (Path(os.environ["RUNNER_TEMP"]) / "reviewed-go/go.sum").read_text().splitlines()
          if not set(before).issubset(set(after)) or len(set(after)) != len(after):
              raise SystemExit("Go dependency checksums changed or duplicate entries appeared")
          added = sorted(set(after) - set(before))
          print(f"GOLOCK_EXTRA_CHECKSUMS={len(added)}")
          for line in added:
              print("GOLOCK_ADDED|" + line)
          data = ("\n".join(after) + "\n").encode()
          value = base64.b64encode(data).decode()
          chunks = [value[i:i+1500] for i in range(0, len(value), 1500)]
          for i, chunk in enumerate(chunks):
              print(f"GOLOCK_CHUNK|{i}|{len(chunks)}|{chunk}")
          print(f"GOLOCK_DIGEST|{hashlib.sha256(data).hexdigest()}|{len(data)}")
          PY
