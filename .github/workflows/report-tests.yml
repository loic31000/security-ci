name: Report generator tests
on:
  push:
    branches: [main, feat/readable-quality-reports]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reports:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Install report parser dependency
        run: python -m pip install 'defusedxml==0.7.1'
      - name: Test Markdown report generators
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Prove certification on real executed JUnit tests
        run: |
          python -m pip install 'pytest==8.4.2'
          mkdir -p .audit-tests
          start_ns="$(python -c 'import time; print(time.time_ns())')"
          python -m pytest tests -q --junitxml=.audit-tests/junit.xml
          python scripts/test_report_validator.py --path .audit-tests/junit.xml \
            --workspace "$GITHUB_WORKSPACE" --start-ns "$start_ns"

      # TEMPORARY bootstrap; removed before merge. Runs only on this trusted PR branch.
      - name: Setup Go for one-time lock bootstrap
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/preinstall-python-go-locks' && github.event.pull_request.head.repo.full_name == 'loic31000/security-ci'
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: '1.25.x'
          cache: false
      - name: Generate exact Python artifact hashes and Go locks on trusted runner
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/preinstall-python-go-locks' && github.event.pull_request.head.repo.full_name == 'loic31000/security-ci'
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/pinned-python"
          "$RUNNER_TEMP/pinned-python/bin/python" -m pip install --disable-pip-version-check \
            'semgrep==1.179.0' 'zizmor==1.30.1' 'radon==6.0.1' \
            'lizard==1.17.10' 'defusedxml==0.7.1' 'pytest==8.4.2'
          "$RUNNER_TEMP/pinned-python/bin/python" -m pip freeze > "$RUNNER_TEMP/python-requirements.txt"
          "$RUNNER_TEMP/pinned-python/bin/python" -m pip download \
            --disable-pip-version-check --no-deps --dest "$RUNNER_TEMP/python-dist" \
            -r "$RUNNER_TEMP/python-requirements.txt"
          bash scripts/build_gitleaks.sh "$RUNNER_TEMP/pinned-go" "$RUNNER_TEMP/pinned-bin"
          "$RUNNER_TEMP/pinned-python/bin/python" - <<'PY'
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path
          from packaging.utils import canonicalize_name, parse_wheel_filename, parse_sdist_filename
          tmp = Path(os.environ["RUNNER_TEMP"])
          baseline = json.loads(Path("locks/engine-manifest-sha256.json").read_text())["files"]
          names = {"python/requirements.txt": tmp/"python-requirements.txt",
                   "go/go.mod": tmp/"pinned-go/go.mod", "go/go.sum": tmp/"pinned-go/go.sum"}
          for name, path in names.items():
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              if digest != baseline[name]:
                  raise SystemExit(f"Unexpected dependency drift in {name}: {digest} != {baseline[name]}")
          archives = {}
          for file in (tmp/"python-dist").iterdir():
              if file.name.endswith(".whl"):
                  name, version, _, _ = parse_wheel_filename(file.name)
              else:
                  name, version = parse_sdist_filename(file.name)
              key = (canonicalize_name(name), str(version))
              if key in archives:
                  raise SystemExit(f"Multiple distributions for {key}")
              archives[key] = hashlib.sha256(file.read_bytes()).hexdigest()
          pinned = []
          lines = (tmp/"python-requirements.txt").read_text().splitlines()
          for line in lines:
              if "==" not in line:
                  raise SystemExit(f"Unpinned pip requirement: {line}")
              name, version = line.split("==", 1)
              key = (canonicalize_name(name), version)
              if key not in archives:
                  raise SystemExit(f"No downloaded archive for {key}")
              pinned.append(f"{name}=={version} --hash=sha256:{archives[key]}")
          output = "# Python 3.12 / Ubuntu 24.04, approved dependencies.\n"
          output += "# Each pinned distribution SHA-256 is verified by pip --require-hashes.\n"
          output += "\n".join(pinned)+"\n"
          assets = {"locks/python-tools.txt": output.encode(),
                    "locks/gitleaks/go.mod": (tmp/"pinned-go/go.mod").read_bytes(),
                    "locks/gitleaks/go.sum": (tmp/"pinned-go/go.sum").read_bytes()}
          for name, data in assets.items():
              enc = base64.b64encode(data).decode("ascii")
              chunks = [enc[i:i+1500] for i in range(0, len(enc), 1500)]
              for i, chunk in enumerate(chunks):
                  print(f"LOCKCHUNK|{name}|{i}|{len(chunks)}|{chunk}")
              print(f"LOCKDIGEST|{name}|{hashlib.sha256(data).hexdigest()}|{len(data)}")
          PY
