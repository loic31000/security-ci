name: Report generator tests
on:
  push:
    branches: [main, feat/readable-quality-reports]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reports:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Install report testing dependencies with exact SHA-256 hashes
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: --no-cache-dir -r locks/python-report-tests.txt
      - name: Verify reusable audit uses the exact tested Markdown renderer
        run: |
          set -euo pipefail
          renderer_ref="$(python3 - <<'PY'
          import re
          from pathlib import Path
          workflow = Path(".github/workflows/security-audit.yml").read_text(encoding="utf-8")
          match = re.search(
              r"(?ms)^\s+- name: Charger le générateur de rapport Markdown\s*.*?^\s+ref:\s+([a-f0-9]{40})\s*$",
              workflow,
          )
          if not match:
              raise SystemExit("missing SHA-pinned runtime Markdown reporter")
          print(match.group(1))
          PY
          )"
          git fetch --no-tags --depth=1 origin "$renderer_ref"
          git show "FETCH_HEAD:scripts/sarif_to_markdown.py" |
            cmp - scripts/sarif_to_markdown.py
      - name: Verify the executed precision checker matches the tested source
        run: |
          set -euo pipefail
          calibration_ref="$(python3 - <<'PY'
          import re
          from pathlib import Path
          workflow = Path(".github/workflows/security-audit.yml").read_text(encoding="utf-8")
          match = re.search(
              r"(?ms)^\s+- name: Charger le validateur SARIF du moteur central\s*.*?^\s+ref:\s+([a-f0-9]{40})\s*$",
              workflow,
          )
          if not match:
              raise SystemExit("missing immutable precision checker reference")
          print(match.group(1))
          PY
          )"
          git fetch --no-tags --depth=1 origin "$calibration_ref"
          git show "FETCH_HEAD:scripts/scanner_precision.py" |
            cmp - scripts/scanner_precision.py
      - name: Verify actual Semgrep drift triage script matches tested source
        run: |
          set -euo pipefail
          drift_ref="$(python3 - <<'PY'
          import re
          from pathlib import Path
          workflow = Path(".github/workflows/security-audit.yml").read_text(encoding="utf-8")
          match = re.search(
              r"(?ms)^\s+- name: Load SHA-pinned non-sensitive Semgrep drift diagnostics\s*.*?^\s+ref:\s+([a-f0-9]{40})\s*$",
              workflow,
          )
          if not match:
              raise SystemExit("missing pinned diagnostic script reference")
          print(match.group(1))
          PY
          )"
          git fetch --no-tags --depth=1 origin "$drift_ref"
          git show "FETCH_HEAD:scripts/semgrep_drift_metadata.py" |
            cmp - scripts/semgrep_drift_metadata.py
      - name: Verify actual Semgrep rule comparison matches tested source
        run: |
          set -euo pipefail
          comparison_ref="$(python3 - <<'PY'
          import re
          from pathlib import Path
          workflow = Path(".github/workflows/security-audit.yml").read_text(encoding="utf-8")
          match = re.search(
              r"(?ms)^\s+- name: Load SHA-pinned non-sensitive Semgrep drift diagnostics\s*.*?^\s+ref:\s+([a-f0-9]{40})\s*$",
              workflow,
          )
          if not match:
              raise SystemExit("missing immutable Semgrep comparison script ref")
          print(match.group(1))
          PY
          )"
          git fetch --no-tags --depth=1 origin "$comparison_ref"
          git show "FETCH_HEAD:scripts/semgrep_ruleset_compare.py" |
            cmp - scripts/semgrep_ruleset_compare.py

      - name: Verify pinned stack coverage checker matches tested source
        run: |
          set -euo pipefail
          coverage_ref="$(python3 - <<'PY'
          import re
          from pathlib import Path
          workflow = Path(".github/workflows/security-audit.yml").read_text(encoding="utf-8")
          match = re.search(
              r"(?ms)^\s+- name: Load tested stack coverage evidence checker\s*.*?^\s+ref:\s+([a-f0-9]{40})\s*$",
              workflow,
          )
          if not match:
              raise SystemExit("missing SHA-pinned stack checker")
          print(match.group(1))
          PY
          )"
          git fetch --no-tags --depth=1 origin "$coverage_ref"
          git show "FETCH_HEAD:scripts/stack_coverage.py" |
            cmp - scripts/stack_coverage.py
      - name: Verify executed self-test dependency lock matches tested lock
        run: |
          set -euo pipefail
          lock_ref="$(python3 - <<'PY'
          import re
          from pathlib import Path
          source = Path(".github/workflows/security-audit.yml").read_text(encoding="utf-8")
          match = re.search(
              r"(?ms)^\s+- name: Charger les dépendances des tests du moteur approuvées\s*.*?^\s+ref:\s+([a-f0-9]{40})\s*$",
              source,
          )
          if not match:
              raise SystemExit("missing immutable self-test dependency checkout")
          print(match.group(1))
          PY
          )"
          git fetch --no-tags --depth=1 origin "$lock_ref"
          git show "FETCH_HEAD:locks/python-report-tests.txt" |
            cmp - locks/python-report-tests.txt
      - name: Test Markdown report generators
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Prove certification on real executed JUnit tests
        run: |
          mkdir -p .audit-tests
          start_ns="$(python -c 'import time; print(time.time_ns())')"
          python -m pytest tests -q --junitxml=.audit-tests/junit.xml
          python scripts/test_report_validator.py --path .audit-tests/junit.xml \
            --workspace "$GITHUB_WORKSPACE" --start-ns "$start_ns"
