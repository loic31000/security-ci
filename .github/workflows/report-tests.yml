name: Report generator tests
on:
  push:
    branches: [main, feat/readable-quality-reports]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reports:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Install report testing dependencies with exact SHA-256 hashes
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: --no-cache-dir -r locks/python-report-tests.txt
      - name: Test Markdown report generators
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Prove certification on real executed JUnit tests
        run: |
          mkdir -p .audit-tests
          start_ns="$(python -c 'import time; print(time.time_ns())')"
          python -m pytest tests -q --junitxml=.audit-tests/junit.xml
          python scripts/test_report_validator.py --path .audit-tests/junit.xml \
            --workspace "$GITHUB_WORKSPACE" --start-ns "$start_ns"

      # TEMPORARY bootstrap — remove before merge. Public registry config only.
      - name: Capture current Semgrep Registry ruleset evidence
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'loic31000/security-ci' && github.head_ref == 'feat/deterministic-semgrep-npm-actionlint'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/semgrep-bootstrap"
          curl --fail --silent --show-error --location --retry 3 \
            --connect-timeout 20 --max-time 90 \
            -H 'Accept: application/json' \
            https://semgrep.dev/c/p/security-audit \
            --output "$RUNNER_TEMP/semgrep-bootstrap/rules.json"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          file = Path(os.environ["RUNNER_TEMP"]) / "semgrep-bootstrap/rules.json"
          body = file.read_text()
          print(f"SEMGREP_CONFIG_LENGTH={len(body)}")
          print(f"SEMGREP_CONFIG_PREFIX={body[:180]!r}")
          try:
              data = json.loads(body)
          except json.JSONDecodeError:
              print("Public registry response is not JSON; determine format before pinning")
          else:
              rules = data.get("rules")
              if not isinstance(rules, list) or len(rules) < 100:
                  raise SystemExit("Semgrep Registry returned unexpectedly few rules")
              ids = [r.get("id") for r in rules]
              if len(set(ids)) != len(ids):
                  raise SystemExit("Duplicate Semgrep rule IDs in registry response")
              print(f"Rules downloaded: {len(rules)}")
          print(f"SEMGREP_BUNDLE_SHA256={hashlib.sha256(file.read_bytes()).hexdigest()}")
          PY
      - name: Preserve public Semgrep config for offline inspection
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'loic31000/security-ci' && github.head_ref == 'feat/deterministic-semgrep-npm-actionlint'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: semgrep-bootstrap-${{ github.run_id }}
          path: ${{ runner.temp }}/semgrep-bootstrap/rules.json
          retention-days: 3
          if-no-files-found: error
