name: Experimental GitLab Semgrep OCI image qualification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-oci-experiment:
    name: Anonymous GitLab image + offline Semgrep + SARIF
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - name: Checkout test harness only
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Confirm Docker is available
        run: docker info --format 'Docker daemon OS: {{.OperatingSystem}}'

      - name: Run OCI digest and offline detection qualification
        run: python3 scripts/experiments/test_gitlab_analyzer_image.py

      - name: Upload metadata only (no image, rules or third-party code)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gitlab-analyzer-oci-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/gitlab-oci-test/evidence.json
          if-no-files-found: warn
          retention-days: 7
