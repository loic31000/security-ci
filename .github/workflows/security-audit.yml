name: Security Audit

on:
  workflow_call:
    inputs:
      enforce:
        description: Faire échouer les contrôles en présence d'alertes
        type: boolean
        default: false
      test_command:
        description: Commande de tests du dépôt appelant (obligatoire pour les dépôts externes)
        type: string
        default: ''
      require_test_report:
        description: Exiger un fichier JUnit XML récent contenant au moins un test réussi (mode strict)
        type: boolean
        default: false
      test_report_path:
        description: Chemin relatif du fichier JUnit XML produit par test_command
        type: string
        default: ''
      coverage_paths:
        description: Chemins de rapports de couverture à archiver (optionnels, séparés par des retours à la ligne)
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      enforce:
        description: Activer le mode strict
        type: boolean
        default: false
  schedule:
    - cron: '17 4 * * 1'
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    name: Audit - ${{ matrix.scanner }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        scanner: [semgrep, trivy, gitleaks, zizmor]
    defaults:
      run:
        shell: bash
    env:
      SCANNER: ${{ matrix.scanner }}
      ENFORCE: ${{ inputs.enforce || false }}
    steps:
      - name: Récupérer le code du dépôt appelant
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Préparer les rapports
        run: |
          report_dir="$RUNNER_TEMP/security-reports"
          mkdir -p "$report_dir"
          echo "REPORT_DIR=$report_dir" >> "$GITHUB_ENV"

      - name: Préparer Python
        if: matrix.scanner == 'semgrep' || matrix.scanner == 'zizmor'
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'

      - name: Charger les versions et hachages Python approuvés
        if: matrix.scanner == 'semgrep' || matrix.scanner == 'zizmor'
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: loic31000/security-ci
          ref: 391fd2225bbf09100b3edf695c294b1bc8728bdb
          path: .audit-python-lock
          persist-credentials: false

      - name: Installer Semgrep et ses dépendances avec hachages vérifiés
        if: matrix.scanner == 'semgrep'
        working-directory: ${{ runner.temp }}
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: --no-cache-dir -r "$GITHUB_WORKSPACE/.audit-python-lock/locks/python-tools.txt"

      - name: Load SHA-pinned non-sensitive Semgrep drift diagnostics
        if: matrix.scanner == 'semgrep'
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: loic31000/security-ci
          ref: 7907cfe8105de4045f5f6ad48afaab29ec5e0aab
          path: .audit-drift-tools
          persist-credentials: false

      - name: Verify exact reviewed Semgrep rules before use
        if: matrix.scanner == 'semgrep'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/semgrep-approved"
          # Only a byte-for-byte match with the already-reviewed 225-rule
          # bundle is usable. Some registry replicas may briefly serve
          # different revisions; retrying never authorizes a new digest.
          bundle="$RUNNER_TEMP/semgrep-approved/rules.yaml"
          verified=false
          for attempt in 1 2 3; do
            if curl --fail --silent --show-error --location --retry 2 \
                --connect-timeout 20 --max-time 90 -H 'Accept: text/yaml' \
                https://semgrep.dev/c/p/security-audit \
                --output "$bundle" &&
                python3 .audit-python-lock/scripts/verify_semgrep_bundle.py \
                  "$bundle" .audit-python-lock/locks/semgrep-security-audit.json; then
              verified=true
              break
            fi
            echo "::warning::Semgrep registry attempt $attempt returned no approved bundle; unverified rules were NOT executed"
            if (( attempt < 3 )); then sleep "$attempt"; fi
          done
          if [[ "$verified" != "true" ]]; then
            # Only hashes, counts and anonymous identifier digests are saved.
            # The unauthorized YAML never leaves the ephemeral runner.
            python3 .audit-drift-tools/scripts/semgrep_drift_metadata.py \
              "$bundle" .audit-python-lock/locks/semgrep-security-audit.json \
              "$REPORT_DIR/semgrep-registry-drift.json"
            echo "::error::The reviewed Semgrep ruleset is unavailable. Fail closed; review the registry drift separately."
            exit 1
          fi
          echo "SEMGREP_CONFIG_PATH=$RUNNER_TEMP/semgrep-approved/rules.yaml" >> "$GITHUB_ENV"

      - name: Installer zizmor avec hachages vérifiés
        if: matrix.scanner == 'zizmor'
        working-directory: ${{ runner.temp }}
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: --no-cache-dir -r "$GITHUB_WORKSPACE/.audit-python-lock/locks/python-zizmor.txt"

      - name: Préparer Go
        if: matrix.scanner == 'gitleaks'
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: '1.25.x'
          cache: false

      - name: Charger le script de compilation Gitleaks
        if: matrix.scanner == 'gitleaks'
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: loic31000/security-ci
          ref: 2768c04d5b22601643c48c2c45b6c57757ed9b26
          path: .audit-gitleaks-build
          persist-credentials: false

      - name: Compiler Gitleaks avec ses dépendances corrigées
        if: matrix.scanner == 'gitleaks'
        run: bash .audit-gitleaks-build/scripts/build_gitleaks.sh "$RUNNER_TEMP/gitleaks-module" "$RUNNER_TEMP/security-bin"

      - name: Analyser avec Trivy
        id: trivy
        if: matrix.scanner == 'trivy'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: 'v0.70.0'
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          format: sarif
          limit-severities-for-sarif: 'true'
          output: ${{ runner.temp }}/security-reports/trivy.sarif
          exit-code: '0'
          ignore-unfixed: false
          timeout: 15m
          cache: false
          cache-dir: ${{ runner.temp }}/trivy-cache

      - name: Inventorier les cibles effectivement reconnues par Trivy
        id: trivy_inventory
        if: matrix.scanner == 'trivy' && steps.trivy.outcome == 'success'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: 'v0.70.0'
          skip-setup-trivy: true
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          format: json
          output: ${{ runner.temp }}/security-reports/trivy-targets.json
          exit-code: '0'
          timeout: 15m
          cache: false

      - name: Load tested stack coverage evidence checker
        if: matrix.scanner == 'trivy' && steps.trivy_inventory.outcome == 'success'
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: loic31000/security-ci
          ref: d1ba6e13c3a10250ec6091d6c1dc6d2107bc4f7b
          path: .audit-stack-tools
          persist-credentials: false

      - name: Prove dependency stack coverage from real Trivy inventory
        if: matrix.scanner == 'trivy' && steps.trivy_inventory.outcome == 'success'
        run: |
          python3 .audit-stack-tools/scripts/stack_coverage.py \
            --workspace "$GITHUB_WORKSPACE" \
            --inventory "$REPORT_DIR/trivy-targets.json" \
            --output "$REPORT_DIR/stack-coverage.json"

      - name: Analyser avec Semgrep, Gitleaks ou zizmor
        id: scan
        if: matrix.scanner != 'trivy'
        run: |
          set -euo pipefail
          case "$SCANNER" in
            semgrep)
              semgrep scan \
                --config "$SEMGREP_CONFIG_PATH" \
                --metrics off \
                --disable-version-check \
                --sarif \
                --output "$REPORT_DIR/semgrep.sarif" \
                .
              ;;
            gitleaks)
              "$RUNNER_TEMP/security-bin/gitleaks" git . \
                --redact=100 \
                --report-format sarif \
                --report-path "$REPORT_DIR/gitleaks.sarif" \
                --exit-code 0 \
                --no-banner
              ;;
            zizmor)
              zizmor --offline --strict-collection --min-severity medium --format sarif \
                . > "$REPORT_DIR/zizmor.sarif"
              ;;
            *) exit 2 ;;
          esac

      - name: Vérifier que Semgrep et Gitleaks détectent un problème contrôlé
        if: matrix.scanner == 'semgrep' || matrix.scanner == 'gitleaks'
        run: |
          set -euo pipefail
          fixture_dir="$RUNNER_TEMP/security-detection-canary"
          mkdir -p "$fixture_dir"
          if [[ "$SCANNER" == "semgrep" ]]; then
            printf 'def unsafe(user_input):\n    eval(user_input)\n' > "$fixture_dir/unsafe.py"
            semgrep scan --config "$SEMGREP_CONFIG_PATH" --metrics off \
              --disable-version-check --sarif \
              --output "$fixture_dir/semgrep.sarif" "$fixture_dir/unsafe.py"
          else
            python3 - "$fixture_dir/canary.txt" <<'PY'
          from pathlib import Path
          import sys
          # Synthetic, nonfunctional example; assembled only on ephemeral CI runner.
          Path(sys.argv[1]).write_text(
              'example = "' + 'ghp_' + 'wA9mK2pLxN4vRtQzY6bC8dEfGhJlM0oPq1rS' + '"\n'
          )
          PY
            "$RUNNER_TEMP/security-bin/gitleaks" dir "$fixture_dir" \
              --redact=100 --report-format sarif \
              --report-path "$fixture_dir/gitleaks.sarif" \
              --exit-code 0 --no-banner
          fi
          python3 - "$fixture_dir/$SCANNER.sarif" <<'PY'
          import json
          import sys
          from pathlib import Path
          doc = json.loads(Path(sys.argv[1]).read_text())
          findings = sum(len(run.get("results", [])) for run in doc.get("runs", []))
          if findings < 1:
              raise SystemExit("Detection canary failed: known synthetic finding was missed")
          print(f"Detection canary succeeded: {findings} finding(s), no real secret used")
          PY

      - name: Vérifier une détection zizmor synthétique
        if: matrix.scanner == 'zizmor'
        run: |
          set -euo pipefail
          fixture_dir="$RUNNER_TEMP/zizmor-detection-canary"
          mkdir -p "$fixture_dir/.github/workflows"
          cat > "$fixture_dir/.github/workflows/insecure.yml" <<'YAML'
          name: Deliberately insecure canary
          on: pull_request_target
          permissions: write-all
          jobs:
            canary:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - run: echo canary
          YAML
          zizmor --offline --min-severity medium --format sarif \
            "$fixture_dir" > "$fixture_dir/result.sarif"
          python3 - "$fixture_dir/result.sarif" <<'PY'
          import json
          import sys
          doc = json.load(open(sys.argv[1]))
          count = sum(len(r.get("results", [])) for r in doc.get("runs", []))
          if count < 1:
              raise SystemExit("zizmor missed deliberate insecure workflow")
          print(f"zizmor canary: {count} expected warning(s) detected")
          PY

      - name: Contrôle négatif - code légitime sans alerte Semgrep/Gitleaks
        if: matrix.scanner == 'semgrep' || matrix.scanner == 'gitleaks'
        run: |
          set -euo pipefail
          safe_dir="$RUNNER_TEMP/security-benign-control"
          mkdir -p "$safe_dir"
          if [[ "$SCANNER" == "semgrep" ]]; then
            cat > "$safe_dir/legitimate.py" <<'PY'
          def compute_invoice_total(values):
              return sum(values)
          PY
            semgrep scan --config "$SEMGREP_CONFIG_PATH" --metrics off \
              --disable-version-check --sarif \
              --output "$safe_dir/semgrep.sarif" "$safe_dir/legitimate.py"
          else
            cat > "$safe_dir/placeholder.txt" <<'TXT'
          Documentation: TOKEN_PLACEHOLDER_IS_NOT_A_REAL_SECRET
          Example URL: https://example.org/account/help
          TXT
            "$RUNNER_TEMP/security-bin/gitleaks" dir "$safe_dir" \
              --redact=100 --report-format sarif \
              --report-path "$safe_dir/gitleaks.sarif" \
              --exit-code 0 --no-banner
          fi
          python3 - "$safe_dir/$SCANNER.sarif" "$SCANNER" <<'PY'
          import json
          import sys
          from pathlib import Path
          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if report.get("version") != "2.1.0" or not isinstance(report.get("runs"), list) or not report["runs"]:
              raise SystemExit("Negative control: missing or invalid SARIF; never call it clean")
          count = 0
          for run in report["runs"]:
              if not isinstance(run, dict) or not isinstance(run.get("results"), list):
                  raise SystemExit("Negative control: incomplete SARIF results")
              if not isinstance(run.get("tool", {}).get("driver", {}).get("name"), str):
                  raise SystemExit("Negative control: missing scanner identity")
              count += len(run["results"])
          if count != 0:
              raise SystemExit(f"Negative control: {count} unexpected candidate(s) in benign fixture")
          print(f"{sys.argv[2]} negative control: 0 findings on limited benign fixture")
          PY

      - name: Contrôle négatif - workflow GitHub Actions légitime pour zizmor
        if: matrix.scanner == 'zizmor'
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/zizmor-benign-control"
          mkdir -p "$fixture/.github/workflows"
          cat > "$fixture/.github/workflows/benign.yml" <<'YAML'
          name: Benign read-only workflow
          on: push
          permissions:
            contents: read
          jobs:
            test:
              runs-on: ubuntu-24.04
              steps:
                - name: Print fixture
                  run: echo "no secrets and no unsafe action"
          YAML
          zizmor --offline --strict-collection --min-severity medium --format sarif \
            "$fixture" > "$fixture/result.sarif"
          python3 - "$fixture/result.sarif" <<'PY'
          import json
          import sys
          from pathlib import Path
          doc = json.loads(Path(sys.argv[1]).read_text())
          runs = doc.get("runs")
          if doc.get("version") != "2.1.0" or not isinstance(runs, list) or not runs:
              raise SystemExit("zizmor negative control: incomplete SARIF")
          if any(not isinstance(r.get("results"), list) for r in runs):
              raise SystemExit("zizmor negative control: results missing")
          count = sum(len(r["results"]) for r in runs)
          if count:
              raise SystemExit(f"zizmor negative control: {count} findings on benign workflow")
          print("zizmor negative control: no findings on the read-only workflow")
          PY

      - name: Charger le validateur SARIF du moteur central
        if: always()
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: loic31000/security-ci
          ref: c44e024078f08e74a6cea37b6a0586984d802fca
          path: .audit-decision-tools
          persist-credentials: false

      - name: Calibrate active detections versus benign fixtures (sample-level)
        if: matrix.scanner == 'semgrep' || matrix.scanner == 'gitleaks' || matrix.scanner == 'zizmor'
        run: |
          set -euo pipefail
          case "$SCANNER" in
            semgrep)
              positive="$RUNNER_TEMP/security-detection-canary/semgrep.sarif"
              negative="$RUNNER_TEMP/security-benign-control/semgrep.sarif"
              expected="unsafe.py"
              ;;
            gitleaks)
              positive="$RUNNER_TEMP/security-detection-canary/gitleaks.sarif"
              negative="$RUNNER_TEMP/security-benign-control/gitleaks.sarif"
              expected="canary.txt"
              ;;
            zizmor)
              positive="$RUNNER_TEMP/zizmor-detection-canary/result.sarif"
              negative="$RUNNER_TEMP/zizmor-benign-control/result.sarif"
              expected="insecure.yml"
              ;;
          esac
          python3 .audit-decision-tools/scripts/scanner_precision.py \
            --scanner "$SCANNER" --positive "$positive" --negative "$negative" \
            --positive-file "$expected" --output "$REPORT_DIR/precision-$SCANNER.json"

      - name: Verify second independent scanner control pair and aggregate calibration
        if: matrix.scanner == 'semgrep' || matrix.scanner == 'gitleaks' || matrix.scanner == 'zizmor'
        run: |
          set -euo pipefail
          controls="$RUNNER_TEMP/precision-second-$SCANNER"
          mkdir -p "$controls/positive" "$controls/negative"
          case "$SCANNER" in
            semgrep)
              cat > "$controls/positive/second_unsafe.py" <<'PY'
          def run_untrusted_expression(untrusted):
              return eval(untrusted)
          PY
              cat > "$controls/negative/second_safe.py" <<'PY'
          import json
          def parse_json_record(text):
              return json.loads(text)
          PY
              semgrep scan --config "$SEMGREP_CONFIG_PATH" --metrics off \
                --disable-version-check --sarif \
                --output "$controls/positive/result.sarif" "$controls/positive/second_unsafe.py"
              semgrep scan --config "$SEMGREP_CONFIG_PATH" --metrics off \
                --disable-version-check --sarif \
                --output "$controls/negative/result.sarif" "$controls/negative/second_safe.py"
              expected="second_unsafe.py"
              ;;
            gitleaks)
              python3 - "$controls/positive/second-canary.txt" <<'PY'
          from pathlib import Path
          import sys
          # Deliberately nonfunctional, assembled inside the ephemeral runner only.
          Path(sys.argv[1]).write_text(
              'sample = "' + 'ghp_' + 'Zy8Bx7Nq6Ps5Rt4Uv3Wx2Yz1Ab0Cd9Ef8GhJ' + '"\n'
          )
          PY
              cat > "$controls/negative/second-placeholder.txt" <<'TXT'
          Documentation: GITHUB_TOKEN=REPLACE_WITH_YOUR_OWN
          URL: https://example.org/docs/credentials
          TXT
              "$RUNNER_TEMP/security-bin/gitleaks" dir "$controls/positive" \
                --redact=100 --report-format sarif \
                --report-path "$controls/positive/result.sarif" \
                --exit-code 0 --no-banner
              "$RUNNER_TEMP/security-bin/gitleaks" dir "$controls/negative" \
                --redact=100 --report-format sarif \
                --report-path "$controls/negative/result.sarif" \
                --exit-code 0 --no-banner
              expected="second-canary.txt"
              ;;
            zizmor)
              mkdir -p "$controls/positive/.github/workflows" "$controls/negative/.github/workflows"
              cat > "$controls/positive/.github/workflows/second-insecure.yml" <<'YAML'
          name: Additional unsafe test workflow
          on: pull_request_target
          permissions: write-all
          jobs:
            check:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - run: echo test
          YAML
              cat > "$controls/negative/.github/workflows/second-safe.yml" <<'YAML'
          name: Additional safe test workflow
          on: workflow_dispatch
          permissions:
            contents: read
          jobs:
            check:
              runs-on: ubuntu-24.04
              steps:
                - run: echo "safe read-only fixture"
          YAML
              zizmor --offline --strict-collection --min-severity medium --format sarif \
                "$controls/positive" > "$controls/positive/result.sarif"
              zizmor --offline --strict-collection --min-severity medium --format sarif \
                "$controls/negative" > "$controls/negative/result.sarif"
              expected="second-insecure.yml"
              ;;
          esac
          python3 .audit-decision-tools/scripts/scanner_precision.py \
            --scanner "$SCANNER" --positive "$controls/positive/result.sarif" \
            --negative "$controls/negative/result.sarif" --positive-file "$expected" \
            --output "$REPORT_DIR/precision-$SCANNER-second.json"
          python3 - "$REPORT_DIR" "$SCANNER" <<'PY'
          import json
          import sys
          from pathlib import Path
          directory, scanner = Path(sys.argv[1]), sys.argv[2]
          controls = [
              json.loads((directory / f"precision-{scanner}.json").read_text()),
              json.loads((directory / f"precision-{scanner}-second.json").read_text()),
          ]
          if any(c.get("status") != "PASS" or c.get("scanner") != scanner
                 or c.get("scanner_identity_checked") is not True for c in controls):
              raise SystemExit("calibration incomplete: mismatched tool or failed control")
          keys = ("true_positive_fixtures", "true_negative_fixtures",
                  "false_positive_fixtures", "false_negative_fixtures")
          summary = {key: sum(c[key] for c in controls) for key in keys}
          if summary != dict(zip(keys, (2, 2, 0, 0))):
              raise SystemExit("incorrect fixture calibration counts")
          summary.update({
              "scanner": scanner, "pairs": 2, "status": "PASS",
              "scope": "synthetic fixture outcomes only; not real-world accuracy",
          })
          (directory / f"precision-{scanner}-summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n")
          print(f"{scanner}: two independent positive/negative fixture pairs verified")
          PY

      - name: Résumé et décision
        if: always()
        env:
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
          TRIVY_OUTCOME: ${{ steps.trivy.outcome }}
          TRIVY_INVENTORY_OUTCOME: ${{ steps.trivy_inventory.outcome }}
        run: python3 .audit-decision-tools/scripts/sarif_decision.py

      - name: Charger le générateur de rapport Markdown
        if: always()
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: loic31000/security-ci
          ref: 74d2754dd1e56fed3632919138bb2d093aa10352
          path: .audit-report-tools
          persist-credentials: false

      - name: Générer le rapport lisible pour les développeurs
        if: always()
        run: python3 .audit-report-tools/scripts/sarif_to_markdown.py "$REPORT_DIR/$SCANNER.sarif" "$REPORT_DIR/$SCANNER.md" --scanner "$SCANNER"

      - name: Conserver le rapport
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-${{ matrix.scanner }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/security-reports/*.sarif
            ${{ runner.temp }}/security-reports/*.md
            ${{ runner.temp }}/security-reports/*.json
          retention-days: 7
          if-no-files-found: warn

  shellcheck:
    name: ShellCheck - Bash scripts
    if: github.repository == 'loic31000/security-ci'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Analyze all engine shell scripts
        run: |
          shellcheck --version
          shellcheck --severity=warning scripts/*.sh

  actionlint:
    name: actionlint - GitHub Actions syntax and expressions
    if: github.repository == 'loic31000/security-ci'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Checkout only Security CI
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Install SHA-256 verified actionlint v1.7.12
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/actionlint-verified"
          curl --fail --silent --show-error --location --retry 3 \
            --connect-timeout 20 --max-time 90 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint-verified/release.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint-verified/release.tar.gz" \
            | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/actionlint-verified/release.tar.gz" \
            -C "$RUNNER_TEMP/actionlint-verified" actionlint
          "$RUNNER_TEMP/actionlint-verified/actionlint" -version
      - name: Lint all Security CI GitHub Actions workflows
        run: |
          "$RUNNER_TEMP/actionlint-verified/actionlint" .github/workflows/*.yml
      - name: Verify actionlint detects an invalid workflow
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/actionlint-verified/invalid.yml" <<'YAML'
          name: Invalid test workflow
          on: push
          jobs:
            broken:
              runs-on: ubuntu-latest
              steps:
                - run: echo canary
                  timeout-minutes: invalid_number
          YAML
          if "$RUNNER_TEMP/actionlint-verified/actionlint" \
            "$RUNNER_TEMP/actionlint-verified/invalid.yml" \
            > "$RUNNER_TEMP/actionlint-verified/canary.log" 2>&1; then
            echo "::error::actionlint did not reject invalid workflow input"
            exit 1
          fi
          grep -q 'timeout-minutes' "$RUNNER_TEMP/actionlint-verified/canary.log" || {
            cat "$RUNNER_TEMP/actionlint-verified/canary.log"
            echo "::error::actionlint did not flag the expected invalid field"
            exit 1
          }
          echo "actionlint positive control detected intentionally invalid timeout-minutes"

  maintainability:
    name: Maintainability - duplication and Python metrics
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout calling repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'

      - name: Load verified Python maintenance locks
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: loic31000/security-ci
          ref: 2768c04d5b22601643c48c2c45b6c57757ed9b26
          path: .audit-python-lock
          persist-credentials: false

      - name: Install Radon, Lizard and defusedxml with hashes
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: --no-cache-dir -r .audit-python-lock/locks/python-maintainability.txt

      - name: Load integrity-pinned npm toolchain
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: loic31000/security-ci
          ref: adb2328ad97333ed89eba86088613f914d4ba4eb
          path: .audit-jscpd-tools
          persist-credentials: false

      - name: Install only approved jscpd npm artifacts
        run: bash .audit-jscpd-tools/scripts/install_jscpd.sh "$RUNNER_TEMP/security-jscpd"

      - name: Measure duplication
        run: |
          mkdir -p "$RUNNER_TEMP/maintainability"
          "$RUNNER_TEMP/security-jscpd/node_modules/.bin/jscpd" --mode strict --min-tokens 100 --min-lines 10 --reporters json --output "$RUNNER_TEMP/maintainability" --threshold 100 --ignore '**/node_modules/**,**/vendor/**,**/dist/**,**/build/**,**/.venv/**,**/coverage/**,**/.git/**,**/.audit-python-lock/**,**/.audit-jscpd-tools/**,**/.audit-report-tools/**' .

      - name: Reject duplication reports contaminated by engine checkouts
        run: |
          python3 - "$RUNNER_TEMP/maintainability/jscpd-report.json" <<'PY'
          import json
          import sys
          from pathlib import PurePosixPath
          report = json.load(open(sys.argv[1], encoding="utf-8"))
          duplicates = report.get("duplicates")
          if not isinstance(duplicates, list):
              raise SystemExit("jscpd: missing duplicate inventory")
          generated = {".git", ".audit-python-lock", ".audit-jscpd-tools",
                       ".audit-report-tools"}
          for duplicate in duplicates:
              for key in ("firstFile", "secondFile"):
                  path = duplicate.get(key, {}).get("name", "")
                  if set(PurePosixPath(path).parts) & generated:
                      raise SystemExit("jscpd: generated checkout included in report")
          PY

      - name: Verify exact duplicate detection with a synthetic clone
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/jscpd-positive-control"
          mkdir -p "$fixture/source" "$fixture/reports"
          python3 - "$fixture/source" <<'PY'
          import sys
          from pathlib import Path
          root = Path(sys.argv[1])
          lines = ["def identical_function(value):"]
          lines += [f"    number_{i} = value * {i} + (value % {i + 3})" for i in range(1, 32)]
          lines.append("    return number_31")
          body = "\n".join(lines) + "\n"
          for name in ("sample_a.py", "sample_b.py"):
              (root / name).write_text(body)
          PY
          "$RUNNER_TEMP/security-jscpd/node_modules/.bin/jscpd" --mode strict --min-tokens 100 --min-lines 10 \
            --reporters json --output "$fixture/reports" --threshold 100 "$fixture/source"
          python3 - "$fixture/reports/jscpd-report.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          duplicates = json.loads(Path(sys.argv[1]).read_text()).get("duplicates", [])
          if not duplicates:
              raise SystemExit("jscpd failed to report an identical 32-line function")
          print(f"jscpd positive control: {len(duplicates)} exact clone(s) detected")
          PY

      - name: Verify different functions are NOT reported as duplicates
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/jscpd-benign-control"
          mkdir -p "$fixture/source" "$fixture/reports"
          python3 - "$fixture/source" <<'PY'
          from pathlib import Path
          import sys
          root = Path(sys.argv[1])
          for label in ("alpha", "bravo"):
              lines = [f"def compute_{label}(input_value):"]
              lines += [f"    unique_{label}_{n} = input_value + '{label}_value_{n}'" for n in range(1, 35)]
              lines.append(f"    return unique_{label}_34")
              (root / (label + ".py")).write_text("\n".join(lines) + "\n")
          PY
          "$RUNNER_TEMP/security-jscpd/node_modules/.bin/jscpd" \
            --mode strict --min-tokens 100 --min-lines 10 \
            --reporters json --output "$fixture/reports" --threshold 100 "$fixture/source"
          python3 - "$fixture/reports/jscpd-report.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          report = json.loads(Path(sys.argv[1]).read_text())
          duplicates = report.get("duplicates")
          if not isinstance(duplicates, list):
              raise SystemExit("jscpd negative control: report missing duplicates inventory")
          if duplicates:
              raise SystemExit(f"jscpd negative control: {len(duplicates)} unexpected duplicate(s)")
          print("jscpd negative control: 0 duplicates in independent functions")
          PY

      - name: Measure Python complexity and maintainability
        run: |
          radon cc . -j -i 'node_modules,vendor,dist,build,.venv,coverage' > "$RUNNER_TEMP/maintainability/python-complexity.json"
          radon mi . -j -i 'node_modules,vendor,dist,build,.venv,coverage' > "$RUNNER_TEMP/maintainability/python-maintainability.json"

      - name: Measure multi-language complexity
        run: |
          lizard --xml . -x './.git/*' -x './.audit-python-lock/*' \
            -x './.audit-jscpd-tools/*' -x './.audit-report-tools/*' \
            > "$RUNNER_TEMP/maintainability/lizard.xml"

      - name: Reject complexity metrics contaminated by engine checkouts
        run: |
          python3 - "$RUNNER_TEMP/maintainability/lizard.xml" <<'PY'
          import sys
          from defusedxml import ElementTree as ET
          root = ET.parse(sys.argv[1])
          forbidden = ("./.git/", "./.audit-python-lock/",
                       "./.audit-jscpd-tools/", "./.audit-report-tools/")
          names = [item.get("name", "") for item in root.findall(".//measure/item")]
          if any(f" at {path}" in name for name in names for path in forbidden):
              raise SystemExit("Lizard: generated checkout included in metrics")
          PY

      - name: Charger le générateur Markdown de maintenabilité
        if: always()
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: loic31000/security-ci
          ref: 61896454a7df3e4959359cbf17ccc1e1fdd63abd
          path: .audit-report-tools
          persist-credentials: false


      - name: Report metrics
        if: always()
        env:
          PYTHONPATH: .audit-report-tools
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "maintainability"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("### Maintenabilité du code\n\n")
              summary.write("**Description :** Ces mesures repèrent du code répété et des fonctions difficiles à maintenir. Elles ne prouvent pas la présence d'une vulnérabilité.\n\n")
              for filename, metric, description in [
                  ("jscpd-report.json", "jscpd : blocs dupliqués", "Nombre de blocs de code similaires détectés dans plusieurs langages."),
                  ("python-complexity.json", "Radon : fonctions Python complexes (>= 11)", "Nombre de fonctions Python dont le cheminement logique est complexe."),
                  ("python-maintainability.json", "Radon : fichiers Python avec indice MI < 20", "Nombre de fichiers Python avec un faible indice de maintenabilité."),
              ]:
                  f = root / filename
                  if not f.exists():
                      summary.write(f"- **{metric}** : rapport indisponible. {description}\n")
                      continue
                  data = json.loads(f.read_text())
                  if filename.startswith("jscpd"):
                      count = len(data.get("duplicates", []))
                  elif filename.startswith("python-complexity"):
                      count = sum(b.get("complexity", 0) >= 11 for bs in data.values() if isinstance(bs, list) for b in bs)
                  else:
                      count = sum(v.get("mi", 100) < 20 for v in data.values() if isinstance(v, dict))
                  summary.write(f"- **{metric}** : {count}. {description}\n")
              xml = root / "lizard.xml"
              if not xml.is_file():
                  raise RuntimeError("Lizard: rapport absent, impossible de conclure")
              from scripts.maintainability_to_markdown import lizard_complexity
              high, total = lizard_complexity(xml)
              summary.write(f"- **Lizard : complexité multi-langage** : {high} fonction(s) de CCN >= 15 sur {total} fonctions mesurées. Indice de complexité, pas un bug.\n")
              summary.write("\n**Interprétation :** ces indicateurs sont informatifs et ne bloquent pas la CI. Rapports JSON/XML dans l’artifact `maintainability-*`.\n")
          PY


      - name: Générer maintainability.md
        if: always()
        run: python3 .audit-report-tools/scripts/maintainability_to_markdown.py "$RUNNER_TEMP/maintainability" "$RUNNER_TEMP/maintainability/maintainability.md"

      - name: Upload maintainability reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: maintainability-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/maintainability/*.json
            ${{ runner.temp }}/maintainability/*.xml
            ${{ runner.temp }}/maintainability/*.md
          retention-days: 7
          if-no-files-found: error

  tests:
    name: Tests du projet et couverture
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout calling repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'

      - name: Vérifier la configuration des tests
        id: test_config
        env:
          TEST_COMMAND: ${{ inputs.test_command }}
        run: |
          if [[ -z "${TEST_COMMAND//[[:space:]]/}" ]]; then
            if [[ "$GITHUB_REPOSITORY" == "loic31000/security-ci" ]]; then
              echo "self_test=true" >> "$GITHUB_OUTPUT"
            else
              echo "::error::Tests non configurés : fournir une vraie commande de tests."
              echo "### Tests du projet : NON VALIDÉS" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          else
            echo "caller_test=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Charger les dépendances des tests du moteur approuvées
        if: ${{ steps.test_config.outputs.self_test == 'true' }}
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: loic31000/security-ci
          ref: 2768c04d5b22601643c48c2c45b6c57757ed9b26
          path: .audit-python-lock
          persist-credentials: false

      - name: Installer les dépendances de tests avec hachages vérifiés
        if: ${{ steps.test_config.outputs.self_test == 'true' }}
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: --no-cache-dir -r .audit-python-lock/locks/python-report-tests.txt

      - name: Tester le moteur security-ci
        if: ${{ steps.test_config.outputs.self_test == 'true' }}
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Record certification start time
        if: ${{ inputs.require_test_report && steps.test_config.outputs.caller_test == 'true' }}
        run: python -c 'import time,os,pathlib; (pathlib.Path(os.environ["RUNNER_TEMP"])/"test-start.ns").write_text(str(time.time_ns()))'

      - name: Run caller-provided tests
        if: ${{ steps.test_config.outputs.caller_test == 'true' }}
        id: caller_tests
        env:
          TEST_COMMAND: ${{ inputs.test_command }}
        run: bash --noprofile --norc -e -o pipefail -c "$TEST_COMMAND"

      - name: Load strict JUnit verifier
        if: ${{ inputs.require_test_report && steps.caller_tests.outcome == 'success' }}
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: loic31000/security-ci
          ref: d625d95eecb7f2ab9bdf598c1a51a3581e4cb705
          path: .audit-cert-tools
          persist-credentials: false

      - name: Charger les dépendances du vérificateur JUnit
        if: ${{ inputs.require_test_report && steps.caller_tests.outcome == 'success' }}
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: loic31000/security-ci
          ref: 2768c04d5b22601643c48c2c45b6c57757ed9b26
          path: .audit-python-lock
          persist-credentials: false

      - name: Certify at least one freshly executed JUnit test
        if: ${{ inputs.require_test_report && steps.caller_tests.outcome == 'success' }}
        env:
          TEST_REPORT_PATH: ${{ inputs.test_report_path }}
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: --no-cache-dir -r .audit-python-lock/locks/python-report-tests.txt
          python .audit-cert-tools/scripts/test_report_validator.py \
            --path "$TEST_REPORT_PATH" \
            --workspace "$GITHUB_WORKSPACE" \
            --start-ns "$(cat "$RUNNER_TEMP/test-start.ns")" | tee "$RUNNER_TEMP/junit-validation.txt"
          {
            echo '### Strict JUnit test certification'
            cat "$RUNNER_TEMP/junit-validation.txt"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Résumé des tests et de la couverture
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.caller_tests.outcome }}
          SELF_TEST: ${{ steps.test_config.outputs.self_test == 'true' }}
          COVERAGE_PATHS: ${{ inputs.coverage_paths }}
        run: |
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          outcome = os.environ.get("TEST_OUTCOME", "unknown")
          report = Path("coverage.xml")
          coverage = None
          if report.is_file():
              try:
                  root = ET.parse(report).getroot()
                  if root.tag == "coverage" and "line-rate" in root.attrib:
                      value = float(root.attrib["line-rate"]) * 100
                      if 0 <= value <= 100:
                          coverage = f"{value:.1f} %"
              except (OSError, ValueError, ET.ParseError):
                  pass
          status = {"success": "Tests réussis", "failure": "Tests échoués",
                    "skipped": "Tests non exécutés"}.get(outcome, "Résultat indisponible")
          if os.environ.get("SELF_TEST") == "true":
              status = "Tests du moteur security-ci exécutés (vérifier le statut du job)"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("### Tests et couverture\n\n")
              summary.write("**Description :** exécute la commande de tests fournie par le projet. La couverture mesure la part de code exécutée par ces tests, si un rapport compatible est disponible.\n\n")
              summary.write(f"- **Résultat des tests :** {status}.\n")
              summary.write(f"- **Couverture mesurée :** {coverage if coverage else 'Non disponible (aucun rapport coverage.xml compatible détecté)'}.\n")
              summary.write("- **Rapports de couverture :** " +
                  ("artifact `coverage-*` si les chemins fournis existent.\n" if os.environ.get("COVERAGE_PATHS", "").strip() else "non configurés.\n"))
              summary.write("\n**Attention :** un test réussi ne prouve pas l'absence de bugs, et un rapport non trouvé ne signifie pas 0 % de couverture.\n")
          PY

      - name: Upload caller-provided coverage reports
        if: always() && inputs.coverage_paths != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ inputs.coverage_paths }}
          retention-days: 7
          if-no-files-found: warn
