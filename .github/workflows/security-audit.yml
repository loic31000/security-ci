name: Security Audit

on:
  workflow_call:
    inputs:
      enforce:
        description: Faire échouer les contrôles en présence d'alertes
        type: boolean
        default: false
      test_command:
        description: Commande de tests du dépôt appelant (optionnelle)
        type: string
        default: ''
      coverage_paths:
        description: Chemins de rapports de couverture à archiver (optionnels, séparés par des retours à la ligne)
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      enforce:
        description: Activer le mode strict
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    name: Audit - ${{ matrix.scanner }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        scanner: [semgrep, trivy, gitleaks, zizmor]
    defaults:
      run:
        shell: bash
    env:
      SCANNER: ${{ matrix.scanner }}
      ENFORCE: ${{ inputs.enforce || false }}
    steps:
      - name: Récupérer le code du dépôt appelant
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Préparer les rapports
        run: |
          report_dir="$RUNNER_TEMP/security-reports"
          mkdir -p "$report_dir"
          echo "REPORT_DIR=$report_dir" >> "$GITHUB_ENV"

      - name: Préparer Python
        if: matrix.scanner == 'semgrep' || matrix.scanner == 'zizmor'
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'

      - name: Installer Semgrep
        if: matrix.scanner == 'semgrep'
        working-directory: ${{ runner.temp }}
        run: python -m pip install 'semgrep==1.179.0'

      - name: Installer zizmor
        if: matrix.scanner == 'zizmor'
        working-directory: ${{ runner.temp }}
        run: python -m pip install 'zizmor==1.30.1'

      - name: Préparer Go
        if: matrix.scanner == 'gitleaks'
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: '1.25.x'
          cache: false

      - name: Installer Gitleaks
        if: matrix.scanner == 'gitleaks'
        working-directory: ${{ runner.temp }}
        run: |
          GOBIN="$RUNNER_TEMP/security-bin" \
            go install github.com/zricethezav/gitleaks/v8@v8.30.1

      - name: Analyser avec Trivy
        id: trivy
        if: matrix.scanner == 'trivy'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: 'v0.70.0'
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          format: sarif
          limit-severities-for-sarif: 'true'
          output: ${{ runner.temp }}/security-reports/trivy.sarif
          exit-code: '0'
          ignore-unfixed: false
          timeout: 15m
          cache: false
          cache-dir: ${{ runner.temp }}/trivy-cache

      - name: Analyser avec Semgrep, Gitleaks ou zizmor
        id: scan
        if: matrix.scanner != 'trivy'
        run: |
          set -euo pipefail
          case "$SCANNER" in
            semgrep)
              semgrep scan \
                --config p/security-audit \
                --metrics off \
                --disable-version-check \
                --sarif \
                --output "$REPORT_DIR/semgrep.sarif" \
                .
              ;;
            gitleaks)
              "$RUNNER_TEMP/security-bin/gitleaks" git . \
                --redact=100 \
                --report-format sarif \
                --report-path "$REPORT_DIR/gitleaks.sarif" \
                --exit-code 0 \
                --no-banner
              ;;
            zizmor)
              zizmor --offline --min-severity medium --format sarif \
                . > "$REPORT_DIR/zizmor.sarif"
              ;;
            *) exit 2 ;;
          esac

      - name: Résumé et décision
        if: always()
        env:
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
          TRIVY_OUTCOME: ${{ steps.trivy.outcome }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          scanner = os.environ["SCANNER"]
          outcome = os.environ[
              "TRIVY_OUTCOME" if scanner == "trivy" else "SCAN_OUTCOME"
          ]
          report = Path(os.environ["REPORT_DIR"]) / f"{scanner}.sarif"
          enforce = os.environ["ENFORCE"].lower() == "true"
          count = None
          error = None
          try:
              if outcome != "success":
                  raise RuntimeError("Analyse non terminée avec succès")
              data = json.loads(report.read_text())
              runs = data["runs"]
              if not isinstance(runs, list) or not runs:
                  raise ValueError("Rapport SARIF incomplet")
              for run in runs:
                  for invocation in run.get("invocations", []):
                      if invocation.get("executionSuccessful") is False:
                          raise RuntimeError("Erreur signalée par le scanner")
                      for notification in invocation.get("toolExecutionNotifications", []):
                          if notification.get("level") == "error":
                              raise RuntimeError("Erreur signalée par le scanner")
              count = sum(len(run.get("results", [])) for run in runs)
          except (OSError, ValueError, KeyError, TypeError, AttributeError, RuntimeError):
              error = "Erreur technique : consulter les logs du contrôle."

          descriptions = {
              "semgrep": "Semgrep examine le code source pour signaler des problèmes de sécurité potentiels.",
              "trivy": "Trivy recherche des vulnérabilités connues dans les dépendances et des erreurs de configuration (niveaux élevés et critiques).",
              "gitleaks": "Gitleaks recherche des secrets potentiels dans l'historique Git, en masquant leurs valeurs.",
              "zizmor": "zizmor vérifie les workflows GitHub Actions et signale les pratiques risquées.",
          }
          status = error or (
              "Alertes détectées" if count else
              "Aucune alerte détectée dans le périmètre analysé"
          )
          mode = "strict" if enforce else "rapport"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"### Audit : {scanner}\n\n")
              summary.write(f"**Description :** {descriptions[scanner]}\n\n")
              summary.write("| État | Alertes | Mode |\n|---|---:|---|\n")
              summary.write(
                  f"| {status} | {count if count is not None else 'N/A'} | {mode} |\n\n"
              )
              summary.write(
                  "Les rapports Markdown (lisibles) et SARIF (outils) sont disponibles dans les artifacts "
                  "si sa génération a abouti.\n"
              )
          if error or (enforce and count):
              sys.exit(1)
          PY

      - name: Charger le générateur de rapport Markdown
        if: always()
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: loic31000/security-ci
          ref: 8b101d2fb0c140ebc11b42ba909af2a803ce6c92
          path: .audit-report-tools
          persist-credentials: false

      - name: Générer le rapport lisible pour les développeurs
        if: always()
        run: python3 .audit-report-tools/scripts/sarif_to_markdown.py "$REPORT_DIR/$SCANNER.sarif" "$REPORT_DIR/$SCANNER.md" --scanner "$SCANNER"

      - name: Conserver le rapport
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-${{ matrix.scanner }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/security-reports/*.sarif
            ${{ runner.temp }}/security-reports/*.md
          retention-days: 7
          if-no-files-found: warn

  maintainability:
    name: Maintainability - duplication and Python metrics
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout calling repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'

      - name: Measure duplication
        run: |
          mkdir -p "$RUNNER_TEMP/maintainability"
          npx --yes jscpd@4.0.5 --reporters json --output "$RUNNER_TEMP/maintainability" --threshold 100 --ignore '**/node_modules/**,**/vendor/**,**/dist/**,**/build/**,**/.venv/**,**/coverage/**' .

      - name: Measure Python complexity and maintainability
        run: |
          python -m pip install 'radon==6.0.1'
          radon cc . -j -i 'node_modules,vendor,dist,build,.venv,coverage' > "$RUNNER_TEMP/maintainability/python-complexity.json"
          radon mi . -j -i 'node_modules,vendor,dist,build,.venv,coverage' > "$RUNNER_TEMP/maintainability/python-maintainability.json"

      - name: Measure multi-language complexity
        run: |
          python -m pip install 'lizard==1.17.10'
          lizard --xml . > "$RUNNER_TEMP/maintainability/lizard.xml"

      - name: Report metrics
        if: always()
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "maintainability"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("### Maintenabilité du code\n\n")
              summary.write("**Description :** Ces mesures repèrent du code répété et des fonctions difficiles à maintenir. Elles ne prouvent pas la présence d'une vulnérabilité.\n\n")
              for filename, metric, description in [
                  ("jscpd-report.json", "jscpd : blocs dupliqués", "Nombre de blocs de code similaires détectés dans plusieurs langages."),
                  ("python-complexity.json", "Radon : fonctions Python complexes (>= 11)", "Nombre de fonctions Python dont le cheminement logique est complexe."),
                  ("python-maintainability.json", "Radon : fichiers Python avec indice MI < 20", "Nombre de fichiers Python avec un faible indice de maintenabilité."),
              ]:
                  f = root / filename
                  if not f.exists():
                      summary.write(f"- **{metric}** : rapport indisponible. {description}\n")
                      continue
                  data = json.loads(f.read_text())
                  if filename.startswith("jscpd"):
                      count = len(data.get("duplicates", []))
                  elif filename.startswith("python-complexity"):
                      count = sum(b.get("complexity", 0) >= 11 for bs in data.values() if isinstance(bs, list) for b in bs)
                  else:
                      count = sum(v.get("mi", 100) < 20 for v in data.values() if isinstance(v, dict))
                  summary.write(f"- **{metric}** : {count}. {description}\n")
              xml = root / "lizard.xml"
              if xml.exists():
                  import xml.etree.ElementTree as ET
                  tree = ET.parse(xml)
                  functions = tree.findall(".//item")
                  high = sum(int(node.get("value", "0")) >= 15 for node in tree.findall(".//measure[@type='Function']/value"))
                  summary.write(f"- **Lizard : complexité multi-langage** : {high} valeurs >= 15 (entrées XML analysées : {len(functions)}). Aide à repérer les fonctions complexes.\n")
              summary.write("\n**Interprétation :** ces indicateurs sont informatifs et ne bloquent pas la CI. Rapports JSON/XML dans l’artifact `maintainability-*`.\n")
          PY

      - name: Charger le générateur Markdown de maintenabilité
        if: always()
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: loic31000/security-ci
          ref: 395c6ceef8e3cb370afd50cc3c6b19c1394e8fdf
          path: .audit-report-tools
          persist-credentials: false

      - name: Générer maintainability.md
        if: always()
        run: python3 .audit-report-tools/scripts/maintainability_to_markdown.py "$RUNNER_TEMP/maintainability" "$RUNNER_TEMP/maintainability/maintainability.md"

      - name: Upload maintainability reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: maintainability-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/maintainability/*.json
            ${{ runner.temp }}/maintainability/*.xml
            ${{ runner.temp }}/maintainability/*.md
          retention-days: 7
          if-no-files-found: error

  tests:
    name: Tests du projet et couverture
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout calling repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'

      - name: Vérifier la configuration des tests
        env:
          TEST_COMMAND: ${{ inputs.test_command }}
        run: |
          if [[ -z "${TEST_COMMAND//[[:space:]]/}" && "$GITHUB_REPOSITORY" != "loic31000/security-ci" ]]; then
            echo "::error::Tests non configurés : fournir with.test_command dans le workflow appelant."
            echo "### Tests du projet : NON VALIDÉS" >> "$GITHUB_STEP_SUMMARY"
            echo "Aucune commande de test fournie. Le job échoue pour éviter un faux résultat vert." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Tester le moteur security-ci
        if: ${{ inputs.test_command == '' && github.repository == 'loic31000/security-ci' }}
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Run caller-provided tests
        if: ${{ inputs.test_command != '' }}
        id: caller_tests
        env:
          TEST_COMMAND: ${{ inputs.test_command }}
        run: bash --noprofile --norc -e -o pipefail -c "$TEST_COMMAND"

      - name: Résumé des tests et de la couverture
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.caller_tests.outcome }}
          SELF_TEST: ${{ github.repository == 'loic31000/security-ci' && inputs.test_command == '' }}
          COVERAGE_PATHS: ${{ inputs.coverage_paths }}
        run: |
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          outcome = os.environ.get("TEST_OUTCOME", "unknown")
          report = Path("coverage.xml")
          coverage = None
          if report.is_file():
              try:
                  root = ET.parse(report).getroot()
                  if root.tag == "coverage" and "line-rate" in root.attrib:
                      value = float(root.attrib["line-rate"]) * 100
                      if 0 <= value <= 100:
                          coverage = f"{value:.1f} %"
              except (OSError, ValueError, ET.ParseError):
                  pass
          status = {"success": "Tests réussis", "failure": "Tests échoués",
                    "skipped": "Tests non exécutés"}.get(outcome, "Résultat indisponible")
          if os.environ.get("SELF_TEST") == "true":
              status = "Tests du moteur security-ci exécutés (vérifier le statut du job)"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("### Tests et couverture\n\n")
              summary.write("**Description :** exécute la commande de tests fournie par le projet. La couverture mesure la part de code exécutée par ces tests, si un rapport compatible est disponible.\n\n")
              summary.write(f"- **Résultat des tests :** {status}.\n")
              summary.write(f"- **Couverture mesurée :** {coverage if coverage else 'Non disponible (aucun rapport coverage.xml compatible détecté)'}.\n")
              summary.write("- **Rapports de couverture :** " +
                  ("artifact `coverage-*` si les chemins fournis existent.\n" if os.environ.get("COVERAGE_PATHS", "").strip() else "non configurés.\n"))
              summary.write("\n**Attention :** un test réussi ne prouve pas l'absence de bugs, et un rapport non trouvé ne signifie pas 0 % de couverture.\n")
          PY

      - name: Upload caller-provided coverage reports
        if: always() && inputs.coverage_paths != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ inputs.coverage_paths }}
          retention-days: 7
          if-no-files-found: warn
