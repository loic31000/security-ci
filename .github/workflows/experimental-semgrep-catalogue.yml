name: Experimental Semgrep rule catalogue qualification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalogue-smoke:
    name: Pinned third-party rule catalogues - isolated tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout only test harness
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'

      - name: Load reviewed Semgrep dependency hashes
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: loic31000/security-ci
          ref: 391fd2225bbf09100b3edf695c294b1bc8728bdb
          path: .candidate-python-lock
          persist-credentials: false

      - name: Install pre-approved Semgrep CLI
        run: 'python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: --no-cache-dir -r .candidate-python-lock/locks/python-tools.txt'

      - name: Checkout pinned GitLab-derived rules (untrusted experiment)
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: qodana/opengrep-sast-rules
          ref: 19af7ed20926ed0b1666e5f78722d4c0824ba99a
          path: .candidate-qodana
          persist-credentials: false

      - name: Checkout pinned 0xdea C and C++ rules (untrusted experiment)
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: 0xdea/semgrep-rules
          ref: dae50da6e6e629750f1daec73a01ef9206a372ab
          path: .candidate-0xdea
          persist-credentials: false

      - name: Isolate third-party sources from the project workspace
        run: |
          set -euo pipefail
          mv .candidate-qodana "$RUNNER_TEMP/candidate-qodana"
          mv .candidate-0xdea "$RUNNER_TEMP/candidate-0xdea"

      - name: Probe official GitLab immutable archive by repository path
        continue-on-error: true
        run: |
          set -euo pipefail
          # The official GitLab 2025 revision is checked separately from the GitHub fork.
          source_sha="39fc7de205d447c70e75a1fdabdcf4588733adc8"
          url="https://gitlab.com/gitlab-org/security-products/sast-rules/-/archive/$source_sha/sast-rules-$source_sha.tar.gz"
          curl --fail --silent --show-error --location --retry 2 \
            --connect-timeout 15 --max-time 90 "$url" \
            --output "$RUNNER_TEMP/gitlab-official.tar.gz"
          tar -tzf "$RUNNER_TEMP/gitlab-official.tar.gz" \
            > "$RUNNER_TEMP/gitlab-official-tree.txt"
          echo "Retrieved GitLab canonical snapshot at $source_sha"
          echo "Archive members:"
          wc -l < "$RUNNER_TEMP/gitlab-official-tree.txt"
          grep -q 'python/eval/rule-eval.yml$' "$RUNNER_TEMP/gitlab-official-tree.txt"

      - name: Compare pinned GitLab source to mirror by exact file hash
        run: python3 scripts/experiments/compare_gitlab_provenance.py

      - name: Audit rule file licenses and test vulnerability/benign pairs
        run: python3 scripts/experiments/evaluate_rule_catalogs.py

      - name: Upload metadata only, never third-party rule source
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: semgrep-catalogue-qualification-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/catalog-qualification.json
            ${{ runner.temp }}/catalog-provenance.json
          retention-days: 7
          if-no-files-found: warn
