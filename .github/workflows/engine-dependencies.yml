name: Engine dependency audit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 1'

permissions:
  contents: read

jobs:
  engine-dependencies:
    name: Resolved dependencies - Python, Node and Go
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout central engine
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Setup Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: '1.25.x'
          cache: false
      - name: Resolve actually used tool dependencies
        env:
          MANIFESTS: ${{ runner.temp }}/security-engine-manifests
        run: |
          set -euo pipefail
          mkdir -p "$MANIFESTS/python" "$MANIFESTS/node" "$MANIFESTS/go"
          python -m venv "$RUNNER_TEMP/engine-py"
          "$RUNNER_TEMP/engine-py/bin/python" -m pip install --disable-pip-version-check \
            'semgrep==1.179.0' 'zizmor==1.30.1' 'radon==6.0.1' \
            'lizard==1.17.10' 'defusedxml==0.7.1' 'pytest==8.4.2'
          "$RUNNER_TEMP/engine-py/bin/python" -m pip freeze > "$MANIFESTS/python/requirements.txt"
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund \
            --prefix "$MANIFESTS/node" 'jscpd@5.4.1'
          test -s "$MANIFESTS/node/package-lock.json"
          bash scripts/build_gitleaks.sh "$MANIFESTS/go" "$RUNNER_TEMP/engine-gitleaks-bin"
          test -s "$MANIFESTS/python/requirements.txt"
          test -s "$MANIFESTS/go/go.mod"
      - name: Scan resolved manifests for known HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: 'v0.70.0'
          scan-type: fs
          scan-ref: ${{ runner.temp }}/security-engine-manifests
          scanners: vuln
          severity: HIGH,CRITICAL
          format: json
          output: ${{ runner.temp }}/security-engine-manifests/trivy-engine.json
          exit-code: '0'
          ignore-unfixed: false
          timeout: 15m
          cache: false
      - name: Verify target coverage and report potential CVEs
        run: |
          python scripts/toolchain_audit.py "$RUNNER_TEMP/security-engine-manifests" \
            "$RUNNER_TEMP/security-engine-manifests/trivy-engine.json" | tee "$RUNNER_TEMP/toolchain-summary.txt"
          {
            echo '### Engine dependency coverage'
            echo ''
            echo 'This scan analyses freshly resolved dependency manifests for Python, Node (jscpd) and Go (Gitleaks).'
            echo 'Potential CVEs require manual validation; a green workflow is not a claim of safety.'
            echo ''
            cat "$RUNNER_TEMP/toolchain-summary.txt"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Prepare synthetic vulnerable Trivy target
        run: |
          mkdir -p "$RUNNER_TEMP/trivy-positive-control"
          printf 'Django==1.11.0\n' > "$RUNNER_TEMP/trivy-positive-control/requirements.txt"
      - name: Scan known vulnerable synthetic dependency
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: 'v0.70.0'
          scan-type: fs
          scan-ref: ${{ runner.temp }}/trivy-positive-control
          scanners: vuln
          severity: HIGH,CRITICAL
          format: json
          output: ${{ runner.temp }}/trivy-positive-control/trivy-canary.json
          exit-code: '0'
          timeout: 15m
          cache: false
      - name: Verify Trivy can detect deliberate dependency advisories
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          report = Path(os.environ["RUNNER_TEMP"]) / "trivy-positive-control/trivy-canary.json"
          obj = json.loads(report.read_text())
          targets = obj.get("Results") or []
          count = sum(len(row.get("Vulnerabilities") or []) for row in targets)
          if count < 1:
              raise SystemExit("Trivy failed to flag synthetic legacy Django dependency")
          print(f"Trivy positive control: {count} advisory candidate(s) detected")
          PY

      - name: Generate CycloneDX SBOM for resolved toolchain
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: 'v0.70.0'
          scan-type: fs
          scan-ref: ${{ runner.temp }}/security-engine-manifests
          scanners: vuln
          format: cyclonedx
          output: ${{ runner.temp }}/security-engine-manifests/engine.cdx.json
          exit-code: '0'
          timeout: 15m
          cache: false
      - name: Validate manifest drift and SBOM evidence
        run: |
          python scripts/manifest_provenance.py \
            --directory "$RUNNER_TEMP/security-engine-manifests" \
            --baseline locks/engine-manifest-sha256.json \
            --sbom "$RUNNER_TEMP/security-engine-manifests/engine.cdx.json" \
            --provenance "$RUNNER_TEMP/security-engine-manifests/engine-provenance.json"
          {
            echo '### Dependency reproducibility evidence'
            echo ''
            echo 'Four manifests matched the reviewed SHA-256 baseline.'
            echo 'CycloneDX SBOM validated; see engine.cdx.json and engine-provenance.json in artifacts.'
            echo 'Hashes are drift checks, NOT signed attestations or proof of exploitability.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep dependency inventory and Trivy results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: engine-dependencies-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/security-engine-manifests/python/requirements.txt
            ${{ runner.temp }}/security-engine-manifests/node/package-lock.json
            ${{ runner.temp }}/security-engine-manifests/go/go.mod
            ${{ runner.temp }}/security-engine-manifests/go/go.sum
            ${{ runner.temp }}/security-engine-manifests/trivy-engine.json
            ${{ runner.temp }}/security-engine-manifests/engine.cdx.json
            ${{ runner.temp }}/security-engine-manifests/engine-provenance.json
          retention-days: 7
          if-no-files-found: warn
